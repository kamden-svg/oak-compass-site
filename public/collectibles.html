    <style>
      :root {
        color-scheme: dark;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: Georgia, "Times New Roman", serif;
        color: #fff7ed;
        background:
          linear-gradient(rgba(16, 10, 7, 0.45), rgba(16, 10, 7, 0.82)),
          url("/collectibles-og-image.png") center / cover no-repeat;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }

      main {
        width: min(720px, 100%);
        padding: 32px;
        border: 1px solid rgba(255, 237, 213, 0.22);
        border-radius: 28px;
        background: rgba(24, 14, 10, 0.68);
        backdrop-filter: blur(14px);
        box-shadow: 0 24px 80px rgba(0, 0, 0, 0.35);
      }

      p {
        margin: 0;
        line-height: 1.7;
      }

      .eyebrow {
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.24em;
        text-transform: uppercase;
        color: #fdba74;
      }

      h1 {
        margin: 14px 0 16px;
        font-size: clamp(2.2rem, 6vw, 4.3rem);
        line-height: 0.98;
      }

      .body {
        max-width: 42rem;
        font-size: 1.05rem;
        color: #fed7aa;
      }

      .actions {
        margin-top: 28px;
        display: flex;
        flex-wrap: wrap;
        gap: 14px;
      }

      .button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 14px 22px;
        border-radius: 999px;
        font-weight: 700;
        text-decoration: none;
        transition: transform 0.18s ease, opacity 0.18s ease;
      }

      .button:hover {
        transform: translateY(-1px);
      }

      .button-primary {
        background: linear-gradient(135deg, #f97316, #facc15);
        color: #2b1408;
      }

      .button-secondary {
        border: 1px solid rgba(255, 237, 213, 0.24);
        background: rgba(255, 255, 255, 0.06);
        color: #fff7ed;
      }

      <div class="actions">
        <a class="button button-primary" href="/#collectibles">Open Collectibles Page</a>
